name: yu_video_player
description: Cache the first N bytes of a remote video to disk on Android and iOS, so the opening seconds play from disk while the rest streams from the network.
version: 1.0.1
homepage: https://github.com/yonglemingyu/yu_video_player
repository: https://github.com/yonglemingyu/yu_video_player
issue_tracker: https://github.com/yonglemingyu/yu_video_player/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.yu.videoplayer
        pluginClass: YUVideoCachePlugin
      ios:
        pluginClass: YUVideoCachePlugin
